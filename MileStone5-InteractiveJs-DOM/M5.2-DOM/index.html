    <!-- we can write java script directly here in script tag  -->
    <script>
      console.log("this is from index file");

      //   here is an object , how we can access it ;
      // student. attribute name
      student = {
        name: "Jahid Hasan",
        id: "222-115-116",
        section: "C",
        subject: function (subjectName) {
          console.log("Studying in ", subjectName);
        },
      };

      console.log(student.id);

      //now here we want to access elements using tag how ?

      // for ul tag
      let list = document.getElementsByTagName("li");
      console.log(list);

      for (item of list) {
        console.log(item);

        // print the list element ;
        for (item of list) {
          console.log(item.innerText);
        }
      }

      // we can also use access class and id

      const listID = document.getElementById("passed");
      console.log(listID.innerText);

      // and so on you can use getElementsByClass();

      const listClass = document.getElementsByClassName("Favorite");
      console.log(listClass);
      for (item of listClass) {
        console.log(item.innerText);
      }
    </script>

    <!-- we can link out js form outside  -->
